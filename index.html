<!DOCTYPE html>
<html lang="ja">
　
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>クーポン抽選 管理画面</title>

<link
    rel="stylesheet"
    href="/coupon-admin/style.css"
>

</head>


<body>

<div class="admin">

    <!-- =========================================
         ヘッダー
    ========================================== -->

    <header class="admin-header">

        <div>

            <h1>
                クーポン抽選システム
            </h1>

            <span>
                管理画面
            </span>

        </div>


        <button
            type="button"
            class="reload-button"
            id="reloadButton"
        >
            データ更新
        </button>

    </header>

<!-- =========================================
     管理カテゴリ
========================================== -->

<nav class="admin-category">

    <button
        type="button"
        class="admin-category-button active"
        data-category="stats"
    >

        <span class="admin-category-icon">
            📊
        </span>

        <span class="admin-category-label">
            発券データ
        </span>

    </button>


    <button
        type="button"
        class="admin-category-button"
        data-category="settings"
    >

        <span class="admin-category-icon">
            ⚙️
        </span>

        <span class="admin-category-label">
            各種設定
        </span>

    </button>

</nav>
    <!-- =========================================
         メッセージ
    ========================================== -->

    <div
        id="message"
        class="message"
        hidden
    ></div>


    <!-- =========================================
         キャンペーン設定
    ========================================== -->

    <section class="admin-card">

        <div class="section-title">

            <div>

                <h2>
                    キャンペーン設定
                </h2>

                <p>
                    開催期間を変更できます。（期間終了後自動的にキャンペーン終了画面になり抽選ができなくなります）
                </p>

            </div>

        </div>


        <div class="campaign-form">

            <div class="form-group">

                <label for="startDate">
                    開始日
                </label>

                <input
                    type="date"
                    id="startDate"
                >

            </div>


            <div class="period-mark">
                〜
            </div>


            <div class="form-group">

                <label for="endDate">
                    終了日
                </label>

                <input
                    type="date"
                    id="endDate"
                >

            </div>

        </div>


        <button
            type="button"
            class="primary-button"
            id="saveCampaignButton"
        >
            開催期間を保存
        </button>

    </section>


    <!-- =========================================
         賞品管理
    ========================================== -->

    <section class="admin-card">

        <div class="section-title">

            <div>

                <h2>
                    賞品管理
                </h2>

                <p>
                    賞品情報を変更し、最後にまとめて保存します。
                </p>

            </div>


            <button
                type="button"
                class="add-button"
                id="addCouponButton"
            >
                ＋ 賞品を追加
            </button>

        </div>


        <!-- 確率合計 -->

        <div class="probability-summary">

            <span>
                当選確率合計
            </span>

            <strong id="probabilityTotal">
                0%
            </strong>

        </div>


        <!-- 賞品一覧 -->

        <div
            id="couponList"
            class="coupon-list"
        >

            <div class="loading">
                読み込み中...
            </div>

        </div>


        <!-- 一括保存 -->

        <div class="coupon-save-area">

            <button
                type="button"
                class="save-coupons-button"
                id="saveCouponsButton"
            >
                クーポン設定を保存
            </button>

        </div>

    </section>


<!-- =========================================
     発券状況
========================================== -->

<section class="admin-card">

    <div class="section-title">

        <div>

            <h2>
                発券状況
            </h2>

            <p>
                賞品ごとの残り枚数と発券数を確認できます。
            </p>

        </div>

        <button
            type="button"
            class="add-button"
            id="reloadStatsButton"
        >
            更新
        </button>

    </div>


    <!-- =====================================
         発券期間切り替え
    ====================================== -->
<div class="stats-period-filter">

    <button
        class="stats-period-button active"
        data-stats-period="today"
    >
        今日
    </button>

    <button
        class="stats-period-button"
        data-stats-period="week"
    >
        1週間
    </button>

    <button
        class="stats-period-button"
        data-stats-period="month"
    >
        1ヶ月
    </button>

    <button
        class="stats-period-button"
        data-stats-period="all"
    >
        全期間
    </button>

</div>

    <!-- =====================================
         発券状況テーブル
    ====================================== -->

    <div class="stats-table-wrap">

        <table class="stats-table">

           <thead id="couponStatsHead">
    <tr>
        <th>ID</th>
        <th>等級</th>
        <th>賞品</th>
        <th>残り枚数</th>
        <th>発券枚数</th>
    </tr>
</thead>

            <tbody id="couponStatsBody">

                <tr>

                    <td
                        colspan="6"
                        class="loading"
                    >
                        読み込み中...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>



<!-- =========================================
     発券履歴
========================================== -->

<section class="admin-card">

    <div class="section-title">

        <div>

            <h2>
                発券履歴
            </h2>

            <p>
                最新の発券履歴を表示します。
            </p>

        </div>

    </div>


    <!-- =====================================
         履歴フィルター
    ====================================== -->

    <div class="history-filter">

        <button
            type="button"
            class="history-filter-button active"
            data-filter="all"
        >
            すべて
        </button>

        <button
            type="button"
            class="history-filter-button"
            data-filter="unused"
        >
            未使用
        </button>

        <button
            type="button"
            class="history-filter-button"
            data-filter="used"
        >
            使用済み
        </button>

    </div>


    <!-- =====================================
         発券履歴テーブル
    ====================================== -->

    <div class="history-table-wrap">

        <table class="history-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>等級</th>

                    <th>賞品</th>

                    <th>発券日時</th>

                    <th>状態</th>

                    <th>使用日時</th>

                </tr>

            </thead>


            <tbody id="historyBody">

                <tr>

                    <td
                        colspan="6"
                        class="loading"
                    >
                        読み込み中...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>




</div>


<script src="script.js"></script>

</body>

</html>
