<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>クーポン抽選 管理画面</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="admin">

    <!-- =========================================
         ヘッダー
    ========================================== -->

    <header class="admin-header">

        <h1>
            クーポン抽選
            <span>管理画面</span>
        </h1>

        <button
            type="button"
            class="reload-button"
            id="reloadButton"
        >
            データ更新
        </button>

    </header>


    <!-- =========================================
         エラー表示
    ========================================== -->

    <div
        id="message"
        class="message"
        hidden
    ></div>


    <!-- =========================================
         キャンペーン設定
    ========================================== -->

    <section class="admin-card">

        <div class="section-title">

            <div>
                <h2>キャンペーン設定</h2>
                <p>開催期間を変更できます。</p>
            </div>

        </div>


        <div class="campaign-form">

            <div class="form-group">

                <label for="startDate">
                    開始日
                </label>

                <input
                    type="date"
                    id="startDate"
                >

            </div>


            <div class="period-mark">
                〜
            </div>


            <div class="form-group">

                <label for="endDate">
                    終了日
                </label>

                <input
                    type="date"
                    id="endDate"
                >

            </div>

        </div>


        <button
            type="button"
            class="primary-button"
            id="saveCampaignButton"
        >
            開催期間を保存
        </button>

    </section>


    <!-- =========================================
         賞品管理
    ========================================== -->

    <section class="admin-card">

        <div class="section-title">

            <div>
                <h2>賞品管理</h2>
                <p>
                    賞品名・当選確率・残り枚数を管理します。
                </p>
            </div>

            <button
                type="button"
                class="add-button"
                id="addCouponButton"
            >
                ＋ 賞品を追加
            </button>

        </div>


        <div
            id="couponList"
            class="coupon-list"
        >

            <div class="loading">
                読み込み中...
            </div>

        </div>

    </section>


    <!-- =========================================
         発券履歴
    ========================================== -->

    <section class="admin-card">

        <div class="section-title">

            <div>
                <h2>発券履歴</h2>
                <p>最新の発券履歴から表示します。</p>
            </div>

        </div>


        <div class="history-table-wrap">

            <table class="history-table">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>等級</th>
                        <th>賞品</th>
                        <th>発券日時</th>
                        <th>状態</th>
                        <th>使用日時</th>

                    </tr>

                </thead>


                <tbody id="historyBody">

                    <tr>

                        <td
                            colspan="6"
                            class="loading"
                        >
                            読み込み中...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- =========================================
         賞品編集モーダル
    ========================================== -->

    <div
        id="couponModal"
        class="modal"
        hidden
    >

        <div class="modal-overlay"></div>


        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    賞品編集
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    id="modalCloseButton"
                >
                    ×
                </button>

            </div>


            <form id="couponForm">

                <input
                    type="hidden"
                    id="couponId"
                >


                <div class="form-group">

                    <label for="couponRank">
                        等級
                    </label>

                    <input
                        type="text"
                        id="couponRank"
                        placeholder="例：1等"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="couponName">
                        賞品名
                    </label>

                    <input
                        type="text"
                        id="couponName"
                        placeholder="例：ドリンク一杯無料券"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="couponProbability">
                        当選確率（％）
                    </label>

                    <input
                        type="number"
                        id="couponProbability"
                        min="0"
                        step="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="couponStock">
                        残り枚数
                    </label>

                    <input
                        type="number"
                        id="couponStock"
                        min="0"
                        step="1"
                        required
                    >

                </div>


                <div class="modal-buttons">

                    <button
                        type="button"
                        class="cancel-button"
                        id="modalCancelButton"
                    >
                        キャンセル
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        保存する
                    </button>

                </div>

            </form>

        </div>

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
